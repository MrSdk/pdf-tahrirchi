services:
  pdf-tahrirchi:
    build: .
    image: pdf-tahrirchi:latest
    container_name: pdf-tahrirchi
    restart: unless-stopped
    ports:
      # faqat shu kompyuterdan ochiladi: http://localhost:8080
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      # Ollama manzili. Bo'sh qoldirilsa, dastur o'zi qidiradi
      # (host.docker.internal:11434 -> 172.17.0.1:11434).
      OLLAMA_URL: "${OLLAMA_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"   # standart model
      OLLAMA_KEEP_ALIVE: "2m"       # ish tugagach model baribir darhol xotiradan chiqariladi
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_NUM_THREAD: "${OLLAMA_NUM_THREAD:-0}"  # 0 = Ollama o'zi tanlaydi; masalan 8 qo'ysangiz, 8 yadro ishlatadi
      OCR_LANGS: "uzb+uzb_cyrl+rus+eng"
      OCR_THREADS: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pdfnet
    volumes:
      - pdf-data:/data
    # kompyuterning boshqa ishlariga xalaqit bermasligi uchun chegaralar
    mem_limit: 1500m
    cpus: 4

networks:
  pdfnet:
    driver_opts:
      # Fixed bridge interface name, so a single firewall rule
      # (ufw allow in on br-pdftahrir ...) survives network re-creation.
      # Linux limits interface names to 15 characters.
      com.docker.network.bridge.name: br-pdftahrir

volumes:
  pdf-data:
